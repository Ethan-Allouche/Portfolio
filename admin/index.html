<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Portfolio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
:root { --bg: #f3f6fc; --ink: #111827; --muted: #4b5563; --plate: #fff; --plate-2: #eef2f9; --line: #cbd5e1; --soft: #e2e8f0; --go: #2563eb; --navy: #1e3a8a; --ok: #15803d; --bad: #b91c1c; --warn: #92400e; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Noto Sans Hebrew', sans-serif; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
[hidden] { display: none !important; }

.top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 9px clamp(12px, 3vw, 28px); background: var(--navy); color: #fff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, .18); }
.top h1 { font-size: 16px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.top .grow { flex: 1; }
.state { font-size: 13px; color: #bfdbfe; }
.state.is-dirty { color: #fde68a; font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--plate); font-weight: 600; font-size: 14px; line-height: 1.2; text-decoration: none; }
.btn:hover { background: var(--plate-2); }
.btn--go { background: var(--go); border-color: var(--go); color: #fff; }
.btn--go:hover { background: #1d4ed8; }
.top .btn { border-color: transparent; color: var(--ink); }
.top .btn--go { color: #fff; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .5); }
.btn--quiet { min-height: 34px; padding: 5px 10px; font-size: 13px; font-weight: 500; }
.btn--danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.pick { display: inline-flex; padding: 3px; border-radius: 11px; background: rgba(255, 255, 255, .16); }
.pick button { min-height: 34px; padding: 0 11px; border: 0; border-radius: 8px; background: transparent; color: #dbeafe; font-size: 13px; font-weight: 700; }
.pick button[aria-pressed='true'] { background: #fff; color: var(--navy); }

.wrap { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px; max-width: 1180px; margin: 0 auto; padding: 20px clamp(12px, 3vw, 28px) 96px; }
.nav { position: sticky; top: 76px; align-self: start; display: grid; gap: 4px; }
.nav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; font-weight: 500; text-align: start; }
.nav button:hover { background: var(--plate-2); }
.nav button[aria-current='true'] { background: var(--navy); color: #fff; }
.nav .n { font-size: 12px; opacity: .7; }
.main { display: grid; gap: 16px; align-content: start; min-width: 0; }
.main > h2 { font-size: 26px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--navy); }
.intro { max-width: 70ch; color: var(--muted); }
.panel { display: grid; gap: 16px; padding: 18px; border-radius: 16px; background: var(--plate); border: 1px solid var(--soft); }
.panel h3 { font-size: 16px; font-weight: 700; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; align-items: start; }

.f { display: grid; gap: 5px; min-width: 0; margin: 0; padding: 0; border: 0; }
.f > legend, .f > .lab { padding: 0; font-size: 13.5px; font-weight: 600; }
.hint { font-size: 12.5px; color: var(--muted); }
input[type='text'], input[type='url'], input[type='email'], input[type='password'], select, textarea { width: 100%; min-height: 40px; padding: 8px 10px; border: 1.5px solid var(--soft); border-radius: 9px; background: #fff; }
textarea { min-height: 76px; resize: vertical; field-sizing: content; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--go); outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, .18); }
.lrow { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: start; gap: 6px; }
.ltag { display: grid; place-items: center; height: 40px; border-radius: 8px; background: var(--plate-2); font-size: 11.5px; font-weight: 700; }
.ltag { color: var(--navy); }
.lrow.is-missing .ltag { background: #fde8c8; color: var(--warn); }
.lrow.is-missing input, .lrow.is-missing textarea { border-color: #e2a24a; background: #fffaf2; }
body[data-view='fr'] .lrow:not([data-l='fr']), body[data-view='en'] .lrow:not([data-l='en']), body[data-view='he'] .lrow:not([data-l='he']) { display: none; }

.card { border: 1px solid var(--soft); border-radius: 14px; background: var(--plate); }
.card > summary { display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-weight: 600; cursor: pointer; list-style: none; }
.card > summary::-webkit-details-marker { display: none; }
.card > summary::before { content: ''; flex: none; width: 8px; height: 8px; border-inline-end: 2px solid var(--go); border-block-end: 2px solid var(--go); transform: rotate(-45deg); transition: transform .15s; }
.card[open] > summary::before { transform: rotate(45deg); }
.card > summary .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card > summary .tools { display: inline-flex; gap: 4px; }
.card__body { display: grid; gap: 16px; padding: 4px 14px 18px; }
.ico { display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 1.5px solid var(--soft); border-radius: 9px; background: #fff; font-size: 15px; line-height: 1; }
.ico:hover { background: var(--plate-2); }
.ico:disabled { opacity: .35; cursor: default; }
.mini { display: grid; gap: 8px; }
.mini__row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px; border-radius: 10px; background: var(--plate-2); }
.mini__row .f { gap: 4px; }
.media-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px; border-radius: 12px; background: var(--plate-2); }
.thumb { width: 96px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: #dbe3ef; display: grid; place-items: center; font-size: 11px; color: var(--muted); text-align: center; overflow: hidden; }
.media-row .stack { display: grid; gap: 8px; min-width: 0; }
.file { position: relative; overflow: hidden; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.sub { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: none; }
.msg { padding: 10px 12px; border-radius: 10px; font-size: 14px; }
.msg--ok { background: #dff3e6; color: #14532d; }
.msg--bad { background: #fde4e1; color: #7a1a12; }
.msg--info { background: #e6ebf7; color: #1e3a8a; }
.msg--warn { background: #fdefd3; color: #6b4400; }
.steps { display: grid; gap: 6px; padding-inline-start: 20px; list-style: decimal; max-width: 70ch; }
.log { display: grid; gap: 4px; font-size: 13.5px; }
code { padding: 1px 5px; border-radius: 5px; background: var(--plate-2); font-size: .92em; }

@media (max-width: 860px) {
  .wrap { grid-template-columns: 1fr; gap: 14px; padding-top: 12px; }
  .nav { position: static; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .nav button { width: auto; white-space: nowrap; border: 1.5px solid var(--soft); background: var(--plate); }
  .main > h2 { font-size: 23px; }
  .media-row { grid-template-columns: 64px minmax(0, 1fr); }
  .media-row .thumb { width: 64px; }
  .media-row > .tools { grid-column: 1 / -1; justify-self: end; }
  .top h1 { font-size: 15px; }
  .state { order: 5; flex-basis: 100%; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Admin du portfolio</h1>
  <span class="state" id="state" role="status"></span>
  <span class="grow"></span>
  <span class="pick" id="view" role="group" aria-label="Langues affichées dans les champs"></span>
  <a class="btn" id="preview" href="../index.html?draft" target="_blank" rel="noopener">Aperçu</a>
  <button class="btn btn--go" id="go" type="button">Publier</button>
</header>
<div class="wrap">
  <nav class="nav" id="nav" aria-label="Rubriques"></nav>
  <main class="main" id="main"></main>
</div>
<noscript><p style="padding:24px">L'admin a besoin de JavaScript.</p></noscript>
<script src="../data/content.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
